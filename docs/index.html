<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152a"><title>Trailer Hunt</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><div class="eyebrow">THE TINY HOUSE PROJECT</div><h1>Trailer <span>Hunt</span></h1><p>Find the foundation for your next adventure.</p></header>
<section class="toolbar"><label>Search listings<input id="search" placeholder="Trailer, flatbed, city..." autocomplete="off"></label><label>Maximum price<input id="price" type="number" min="0" value="1500"></label><label>City<select id="city"><option value="">All cities</option></select></label><label>Sort<select id="sort"><option value="new">Newest first</option><option value="low">Lowest price</option><option value="high">Highest price</option></select></label><label class="toggle"><input type="checkbox" id="favorites"> Favorites only</label></section>
<section class="source-hub"><div class="source-heading"><div><div class="eyebrow">EXPAND THE SEARCH</div><h2>Hunting grounds</h2><p>Search other marketplaces in a new tab. These links are not automatic imports.</p></div></div><div class="source-controls"><label>What are we hunting?<select id="source-query"><option value="16 ft utility trailer">16 ft utility trailer</option><option value="8.5x16 trailer">8.5 × 16 trailer</option><option value="flatbed trailer">Flatbed trailer</option><option value="equipment trailer">Equipment trailer</option><option value="car hauler trailer">Car hauler</option><option value="trailer frame">Trailer frame / chassis</option><option value="used utility trailer">Used utility trailer</option></select></label><label>Search area<select id="source-region"><option value="South Carolina Georgia">SC + GA</option><option value="Charleston South Carolina">Charleston</option><option value="Columbia South Carolina">Columbia</option><option value="Myrtle Beach South Carolina">Myrtle Beach</option><option value="Hilton Head South Carolina">Hilton Head</option><option value="Savannah Georgia">Savannah</option><option value="Augusta Georgia">Augusta</option><option value="Appalachia">Appalachia</option><option value="North Carolina">North Carolina</option><option value="Tennessee">Tennessee</option><option value="Virginia">Virginia</option><option value="West Virginia">West Virginia</option><option value="Kentucky">Kentucky</option><option value="United States">Nationwide</option></select></label></div><div id="source-links" class="source-links"></div></section><div class="status" id="status">Loading listings...</div><section id="results" class="results" aria-live="polite"></section>
<footer><span>© Trailer Hunt</span><span>Built for the tiny house dream</span><a href="https://github.com/JadesTheDev/Trailer-Hunt">GitHub ↗</a></footer></main><script src="app.js" defer></script></body></html>
